<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Team OS OG Image 변환</title>
<style>
body{margin:0;background:#05060a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;color:#fff;gap:20px;}
canvas{border:1px solid rgba(255,255,255,.1);max-width:100%;}
button{padding:12px 28px;background:#00c9a7;color:#05060a;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
p{font-size:13px;color:#8a9ab5;text-align:center;}
</style>
</head>
<body>
<p>아래 캔버스 확인 후 다운로드 → GitHub teamos/ 폴더에 og-image-teamos.png 로 업로드</p>
<canvas id="c" width="1200" height="630"></canvas>
<button onclick="download()">⬇ og-image-teamos.png 다운로드</button>
<script>
const svgUrl = 'og-image-teamos.svg';
const img = new Image();
img.onload = () => {
  const c = document.getElementById('c');
  c.getContext('2d').drawImage(img, 0, 0);
};
img.src = svgUrl;

function download() {
  const a = document.createElement('a');
  a.download = 'og-image-teamos.png';
  a.href = document.getElementById('c').toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
